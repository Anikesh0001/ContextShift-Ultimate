<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">ContextShift Ultimate</title>
  <desc id="desc">A glowing indigo and teal abstract banner about carrying context between AI conversations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b1020"/><stop offset="58%" stop-color="#171b3d"/><stop offset="100%" stop-color="#073b43"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a5b4fc"/><stop offset="100%" stop-color="#5eead4"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="15" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="380" rx="30" fill="url(#bg)"/>
  <circle cx="970" cy="80" r="145" fill="#6366f1" opacity=".16"/>
  <circle cx="1100" cy="290" r="180" fill="#14b8a6" opacity=".13"/>
  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".75">
    <path d="M750 70 C870 70 845 150 940 150 S1030 235 1130 235"/>
    <path d="M720 120 C820 120 835 200 930 200 S1045 290 1160 290"/>
    <path d="M780 265 C860 265 875 215 955 215 S1040 110 1140 110"/>
  </g>
  <g filter="url(#glow)" stroke="url(#accent)" stroke-width="3" fill="#10172d">
    <rect x="830" y="105" width="110" height="80" rx="18"/>
    <rect x="955" y="170" width="110" height="80" rx="18"/>
    <rect x="1050" y="68" width="90" height="70" rx="16"/>
  </g>
  <g fill="#c7d2fe"><circle cx="856" cy="130" r="4"/><circle cx="869" cy="130" r="4"/><circle cx="882" cy="130" r="4"/></g>
  <g stroke="#5eead4" stroke-width="4" stroke-linecap="round"><path d="M852 152h65"/><path d="M977 199h66"/><path d="M977 215h47"/><path d="M1070 96h48"/><path d="M1070 111h32"/></g>
  <g fill="url(#accent)"><circle cx="940" cy="150" r="6"/><circle cx="955" cy="215" r="6"/><circle cx="1050" cy="110" r="6"/></g>
  <text x="72" y="95" fill="#a5b4fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4">YOUR AI WORKFLOW COMPANION</text>
  <text x="68" y="170" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="800">Keep the context.</text>
  <text x="68" y="230" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="800">Continue the work.</text>
  <text x="72" y="280" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Capture · Search · Handoff · Pick up where you left off</text>
  <rect x="72" y="315" width="245" height="3" rx="2" fill="url(#accent)"/>
